name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: uv sync
        
      - name: Run unit tests
        run: uv run pytest tests/
        
      - name: Set up .env
        run: cp .env.example .env

      - name: Start Docker stack
        run: |
          docker compose --profile pipeline up -d
          
      - name: Wait for services to be healthy
        run: |
          # Wait up to 60 seconds for ClickHouse
          timeout 60s bash -c 'until curl -s http://localhost:8123/ping; do sleep 2; done'
          
          # Wait up to 60 seconds for API
          timeout 60s bash -c 'until curl -s http://localhost:8001/api/v1/health | grep -q "\"status\":\"ok\""; do sleep 2; done'
          
          # Run database migrations
          uv run python scripts/migrate.py
          
      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh
          
      - name: Tear down Docker stack
        if: always()
        run: docker compose --profile pipeline down -v
